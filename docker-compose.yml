services:
  app:
    build: .
    container_name: app_php
    ports:
      - 8080:80
    volumes:
      - ./public:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: andina
    ports:
      - 3307:3306
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
      - data:/var/lib/mysql

volumes:
  data: